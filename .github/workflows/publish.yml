name: Publish to npm

# Releases are cut by pushing a v* tag — nothing publishes on a plain push to
# main, so ordinary commits never risk a release.
#
# Auth is npm Trusted Publishing (OIDC) — a short-lived token minted per run —
# with the NPM_TOKEN secret as a fallback for the BOOTSTRAP publish. npm only
# lets you configure a trusted publisher on a package that already exists, so
# the very first release of a new package cannot use OIDC alone; the token
# covers it. Once the trusted publisher is configured on npmjs.com, delete the
# NPM_TOKEN secret and this fallback goes dormant (OIDC is tried first and
# wins whenever it is configured).
#
# To release: bump "version" in package.json, add a CHANGELOG entry, commit,
# then `git tag vX.Y.Z && git push origin vX.Y.Z`. The tag must match
# package.json's version — a mismatch fails the run rather than publishing
# something the tag doesn't name.
#
# One-time setup on npmjs.com (dsh-update-notifier → Settings → Trusted Publisher):
#   Organization or user: stuarthu
#   Repository:           dsh-update-notifier
#   Workflow filename:    publish.yml
#   Allowed action:       npm publish
# (Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0, ensured below.)

on:
  push:
    tags: ["v*"]

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false # never cancel a publish mid-flight; queue instead

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing (and provenance)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24" # trusted publishing needs Node >= 22.14.0
          registry-url: "https://registry.npmjs.org"

      - name: Verify the tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $VERSION — bump one of them and re-tag."
            exit 1
          fi
          echo "Releasing $(node -p "require('./package.json').name")@$VERSION"

      - name: Check the version isn't already published
        id: guard
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          # --json makes failures machine-readable: npm prints {"error":{"code":...}}
          # on stdout, so E404 is detected structurally instead of grepping prose
          # (which breaks the day npm rewords its error output).
          set +e
          OUT=$(npm view "$NAME@$VERSION" version --json 2>stderr.txt)
          CODE=$?
          set -e
          if [ $CODE -eq 0 ] && [ -n "$OUT" ]; then
            echo "$NAME@$VERSION is already on npm — nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$OUT" | node -e '
            let s = "";
            process.stdin.on("data", (d) => (s += d)).on("end", () => {
              try { process.exit(JSON.parse(s).error.code === "E404" ? 0 : 1); }
              catch { process.exit(1); }
            });
          '; then
            echo "$NAME@$VERSION not found (E404) — will publish."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            # Non-404 failure (network / registry 5xx / auth): fail the RUN, loudly.
            # A green skip here silently loses the release — a human must be able
            # to see it and re-run the workflow.
            echo "::error::npm view failed for a non-404 reason — failing so the release isn't silently skipped. Re-run this workflow once the registry recovers."
            printf '%s\n' "$OUT"
            cat stderr.txt
            exit 1
          fi

      # Only the publish itself needs npm >= 11.5.1 (trusted publishing); the
      # guard above works with the runner's preinstalled npm.
      - name: Ensure npm supports trusted publishing
        if: steps.guard.outputs.publish == 'true'
        run: npm install -g npm@latest # needs >= 11.5.1

      # The npm CLI prefers the OIDC credential granted by `id-token: write`,
      # verified against the trusted publisher configured on npmjs.com. When no
      # trusted publisher exists yet (the first release of a new package), that
      # exchange yields nothing and npm falls back to NODE_AUTH_TOKEN. With the
      # secret deleted the fallback is simply empty and OIDC is the only path.
      # Provenance is signed either way (it needs `id-token: write`, not OIDC auth).
      - name: Publish
        if: steps.guard.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
