name: Publish to npm

# Releases are cut by pushing a v* tag — nothing publishes on a plain push to
# main, so ordinary commits never risk a release.
#
# Auth is npm Trusted Publishing (OIDC): a short-lived token minted per run,
# no NPM_TOKEN secret to store or rotate.
#
# To release: bump "version" in package.json, add a CHANGELOG entry, commit,
# then `git tag vX.Y.Z && git push origin vX.Y.Z`. The tag must match
# package.json's version — a mismatch fails the run rather than publishing
# something the tag doesn't name.
#
# One-time setup on npmjs.com (dsh-update-notifier → Settings → Trusted Publisher):
#   Organization or user: stuarthu
#   Repository:           dsh-update-notifier
#   Workflow filename:    publish.yml
#   Allowed action:       npm publish

on:
  push:
    tags: ["v*"]

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false # never cancel a publish mid-flight; queue instead

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing (and provenance)
    steps:
      - uses: actions/checkout@v4

      # No `registry-url` on purpose — see the Publish step's note.
      # The floating "24" pin matters: 24.5.0+ bundles npm >= 11.5.1, the
      # trusted-publishing floor, so no global npm upgrade is needed.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify the release
        id: release
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $VERSION — bump one of them and re-tag."
            exit 1
          fi
          # npm picks the package page by globbing {README,README.*} and taking
          # the FIRST match in unsorted readdir order, so a sibling like
          # README.zh.md can publish as the page instead of README.md (it did,
          # in 0.1.0). Any such file must be named so the glob cannot see it.
          STRAY=$(ls -A | grep -iE '^README(\..+)?$' | grep -vx 'README.md' || true)
          if [ -n "$STRAY" ]; then
            echo "::error::$STRAY can win npm's README glob and publish as the package page — rename it (e.g. README-zh.md)."
            exit 1
          fi
          echo "Releasing $NAME@$VERSION"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check the version isn't already published
        id: guard
        env:
          NAME: ${{ steps.release.outputs.name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # --json makes failures machine-readable: npm prints {"error":{"code":...}}
          # on stdout, so E404 is detected structurally instead of grepping prose
          # (which breaks the day npm rewords its error output).
          set +e
          OUT=$(npm view "$NAME@$VERSION" version --json 2>"$RUNNER_TEMP/npm-view.err")
          CODE=$?
          set -e
          if [ $CODE -eq 0 ] && [ -n "$OUT" ]; then
            echo "$NAME@$VERSION is already on npm — nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$(printf '%s' "$OUT" | jq -r '.error.code // ""' 2>/dev/null)" = "E404" ]; then
            echo "$NAME@$VERSION not found (E404) — will publish."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            # Non-404 failure (network / registry 5xx / auth): fail the RUN, loudly.
            # A green skip here silently loses the release — a human must be able
            # to see it and re-run the workflow.
            echo "::error::npm view failed for a non-404 reason — failing so the release isn't silently skipped. Re-run this workflow once the registry recovers."
            printf '%s\n' "$OUT"
            cat "$RUNNER_TEMP/npm-view.err"
            exit 1
          fi

      # Deliberately no long-lived token fallback, and no `registry-url` on
      # setup-node. npm's oidc() never throws — every failure path returns
      # undefined and logs below the default loglevel — so a static credential
      # would silently paper over a broken trusted publisher (renamed workflow,
      # transferred repo) and publish with the secret instead. registry-url is
      # part of that: it writes `_authToken=${NODE_AUTH_TOKEN}` into the npmrc,
      # and @npmcli/config substitutes the LITERAL text back when the variable
      # is unset, which npm reads as a credential (noCreds false) and PUTs as a
      # garbage bearer token — an opaque 401 instead of ENEEDAUTH.
      #
      # The guard below asserts that absence by behavior rather than by comment,
      # so any future reintroduction — here, at job level, or via registry-url —
      # fails the release instead of quietly becoming the auth path.
      - name: Publish
        if: steps.guard.outputs.publish == 'true'
        run: |
          # setup-node exports NPM_CONFIG_USERCONFIG only when given a
          # registry-url, so these two variables are exactly the two routes a
          # static credential can return by. (npm config get refuses to read
          # _authToken back, so this checks the inputs rather than the result.)
          if [ -n "$NODE_AUTH_TOKEN" ] || [ -n "$NPM_CONFIG_USERCONFIG" ]; then
            echo "::error::a static npm credential path is configured (NODE_AUTH_TOKEN / setup-node registry-url) — trusted publishing must be the only auth path."
            exit 1
          fi
          # --loglevel verbose is deliberate: npm's OIDC exchange reports why it
          # failed (`oidc Failed token exchange request with body message: …`)
          # at verbose only, so at the default level a mis-bound trusted
          # publisher gives a bare ENEEDAUTH with no cause. Releases are rare;
          # the extra output is worth the one time it matters.
          npm publish --provenance --access public --loglevel verbose
